name: Collect and deploy

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

concurrency:
  group: collect-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

jobs:
  collect-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Collect bazaar stats
        run: pnpm collect

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: snapshot bazaar stats"
            git push origin HEAD
          fi

      - run: pnpm test

      - run: pnpm build-data

      - run: pnpm typecheck

      - name: Build GitHub Pages
        run: pnpm exec vite build
        env:
          VITE_BASE: /siyuan-bazaar-stats/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Build Cloudflare Pages
        run: pnpm exec vite build
        env:
          VITE_BASE: /

      - uses: actions/upload-artifact@v7
        with:
          name: cf-dist
          path: dist

  github-pages:
    needs: collect-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5

  cloudflare:
    needs: collect-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cf-dist
          path: cf-dist
      - name: Ensure Pages project and custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" "$api/siyuan-bazaar-stats")
          if [ "$status" = "200" ]; then
            echo "Pages project already exists"
          else
            curl -fsS -X POST "$api" -H "$auth" -H 'Content-Type: application/json' \
              -d '{"name":"siyuan-bazaar-stats","production_branch":"main"}' > /dev/null
            echo "Pages project created"
          fi

          domains=$(curl -fsS -H "$auth" "$api/siyuan-bazaar-stats/domains")
          if printf '%s' "$domains" | grep -q '"siyuan-bazaar-stats.mytemos.com"'; then
            echo "Custom domain already attached"
          else
            curl -fsS -X POST "$api/siyuan-bazaar-stats/domains" -H "$auth" \
              -H 'Content-Type: application/json' \
              -d '{"name":"siyuan-bazaar-stats.mytemos.com"}' > /dev/null
            echo "Custom domain attached"
          fi
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cf-dist --project-name=siyuan-bazaar-stats
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
