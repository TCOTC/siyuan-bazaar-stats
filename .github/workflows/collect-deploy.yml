name: Collect and deploy

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

concurrency:
  group: collect-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

jobs:
  collect-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Collect bazaar stats
        run: pnpm collect

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: snapshot bazaar stats"
            git push origin HEAD
          fi

      - run: pnpm test

      - run: pnpm build-data

      - run: pnpm typecheck

      - name: Build GitHub Pages
        run: pnpm exec vite build
        env:
          VITE_BASE: /siyuan-bazaar-stats/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Build Cloudflare Pages
        run: pnpm exec vite build
        env:
          VITE_BASE: /

      - uses: actions/upload-artifact@v4
        with:
          name: cf-dist
          path: dist

  github-pages:
    needs: collect-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5

  cloudflare:
    needs: collect-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cf-dist
          path: cf-dist
      - uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create siyuan-bazaar-stats --production-branch=main
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cf-dist --project-name=siyuan-bazaar-stats
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach custom domain
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          AUTH_HEADER="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/siyuan-bazaar-stats/domains" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            -d '{"name":"siyuan-bazaar-stats.mytemos.com"}' || true
          echo
          ZONES=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=mytemos.com" -H "$AUTH_HEADER")
          echo "$ZONES"
          ZONE_ID=$(python3 -c "import json,sys; r=json.loads(sys.argv[1]).get('result') or []; print(r[0]['id'] if r else '')" "$ZONES")
          echo "zone_id=$ZONE_ID"
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"siyuan-bazaar-stats","content":"siyuan-bazaar-stats.pages.dev","proxied":true}'
